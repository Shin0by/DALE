[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dale-map-editor"
version = "0.2.0"
description = "Local wall-guided transparency editor for Dungeon Alchemist maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "Pillow>=11,<13",
  "shapely>=2.1,<3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
dale = "dale.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
